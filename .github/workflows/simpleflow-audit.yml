name: SimpleFlow audit probes

on:
  push:
    branches:
      - audit/simpleflow-review-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: Install runtime dependencies used by SimpleFlow
        run: cpanm --notest Data::Printer Devel::Confess Devel::Size
      - name: Run audit probes
        run: prove -Ilib -v audit/simpleflow-review.t
